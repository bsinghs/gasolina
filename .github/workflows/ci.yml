# Every push to test or main: run the API tests and build the web app.
# On test: then deploy the API to the TEST copy.  On main: then tag the release v<VERSION> (if new).
# Production deploys are a button: see deploy-production.yml.  Spec: docs/features/ci-cd.md
name: CI

on:
  push:
    branches: [test, main]
  pull_request:
    branches: [test, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  api-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shiftclose_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Tests (incl. database workflow tests)
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shiftclose_test
        run: python -m pytest -q

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Type-check and build
        run: npm run build

  # main: tests passed, so mark the release with a tag (only once per VERSION)
  tag-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [api-tests, web-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag v<VERSION> if it isn't tagged yet
        run: |
          VERSION=$(cat VERSION)
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION already exists (points at $(git rev-list -n1 "v$VERSION" | cut -c1-7)). Nothing to tag."
            exit 0
          fi
          grep -q "^## ${VERSION//./\\.} " CHANGELOG.md || { echo "::error::CHANGELOG.md has no entry for $VERSION"; exit 1; }
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release $VERSION"
          git push origin "v$VERSION"
          echo "Tagged v$VERSION at $(git rev-parse --short HEAD)"

  # test: tests passed, so put the API on the TEST copy (needs the one-time setup in docs/features/ci-cd.md)
  deploy-test-api:
    if: github.event_name == 'push' && github.ref == 'refs/heads/test' && vars.GCP_WIF_PROVIDER != ''
    needs: [api-tests, web-build]
    uses: ./.github/workflows/deploy-api.yml
    with:
      target: test
    permissions:
      contents: read
      id-token: write
