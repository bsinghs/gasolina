# Builds the API and starts it on Cloud Run. Called by CI (test copy) and by "Deploy production" (button).
# Signs in to Google Cloud without any stored key (Workload Identity Federation), see docs/features/ci-cd.md.
name: Deploy API

on:
  workflow_call:
    inputs:
      target:
        type: string
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and deploy (${{ inputs.target }})
        env:
          CI: "true"
          DEPLOYED_BY: github-actions (${{ github.actor }})
        run: bash deploy/cloudrun/deploy.sh ${{ inputs.target }}
