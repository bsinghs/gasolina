# Render blueprint for the API. See docs/DEPLOY.md.
services:
  - type: web
    name: gasolina-api
    runtime: docker
    plan: free
    region: virginia   # same area as the Supabase database (us-east-1)
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: AUTH_MODE
        value: supabase
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: BOOTSTRAP_OWNER_EMAIL
        sync: false
      - key: CORS_ORIGINS
        sync: false
