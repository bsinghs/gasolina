# Local development database.  docker compose up -d db
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gasolina
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql

volumes:
  pgdata:
